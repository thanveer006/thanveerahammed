<!doctype html>
<html lang="en" class="dark h-full antialiased" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- <title>/<meta description>/OG/JSON-LD are owned per-route by <Seo>
         (vite-react-ssg <Head>) and baked into every prerendered page, so no
         static <title> here — it would just duplicate the injected one. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <script>
      // Dark is the default (set on <html>); apply a stored light choice before first paint.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light") {
          document.documentElement.classList.remove("dark");
          document.documentElement.style.colorScheme = "light";
        }
      } catch (e) {}
    </script>
    <noscript>
      <style>
        [style*="opacity:0"],
        [style*="opacity: 0"] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body class="min-h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
